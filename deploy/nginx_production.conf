server {
    listen 80;
    server_name toididaudo.vn www.toididaudo.vn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name toididaudo.vn www.toididaudo.vn;

    # ========================================================
    # CHỨNG CHỈ SSL ĐẦY ĐỦ (FULL CHAIN - TRÁNH LỖI CHROMIUM)
    # ========================================================
    ssl_certificate /etc/letsencrypt/live/toididaudo.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/toididaudo.vn/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/toididaudo;
    index index.html;

    # Gzip nén dữ liệu siêu tốc cho sinh viên dùng 4G
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Cache tài nguyên tĩnh (Ảnh WebP Mascot, Icon, CSS, Font)
    location ~* \.(jpg|jpeg|png|webp|gif|ico|css|js|woff2|woff|ttf|svg)$ {
        proxy_pass http://127.0.0.1:3000;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
